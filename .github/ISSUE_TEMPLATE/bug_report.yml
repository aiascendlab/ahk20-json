name: Bug Report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["type/bug", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have read the troubleshooting guide.
          required: true

  - type: input
    id: version
    attributes:
      label: AHK20_JSON version
      description: Value of JSON.Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: ahk_version
    attributes:
      label: AutoHotkey version
      placeholder: "2.0.27"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Smallest script or JSON text that shows the problem.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        AutoHotkey build (32/64):
      render: text

  - type: dropdown
    id: contribute
    attributes:
      label: Are you willing to submit a fix?
      options: ["Yes", "No", "Maybe, with guidance"]
