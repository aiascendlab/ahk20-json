name: Feature Request
description: Propose a new capability
title: "[Feature]: "
labels: ["type/feature", "status/triage"]
body:
  - type: markdown
    attributes:
      value: Please search existing issues before requesting a feature.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
