version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # github-actions only supports default-days, not semver-*-days.
      default-days: 7
    labels:
      - "type/chore"
      - "dependencies"
